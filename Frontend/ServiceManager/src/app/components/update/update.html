<form [formGroup]="NewOrderForm" (ngSubmit)="onSubmit()" class="p-4 border rounded-3 shadow-lg bg-white">
    
    <h3 class="mb-4 text-primary">Edição da Ordem de Serviço</h3>

    <div class="mb-3">
        <label for="clientName" class="form-label fw-bold">Nome do Cliente:</label>
        <input 
            id="clientName" 
            formControlName="clientName" 
            type="text"
            class="form-control"
            placeholder="Informe o nome do cliente"
        />
        </div>

    <div class="mb-3">
        <label for="description" class="form-label fw-bold">Descrição do Serviço:</label>
        <input 
            id="description" 
            formControlName="description"
            type="text"
            class="form-control"
            placeholder="Detalhes do serviço"
        />
    </div>

    <div class="row mb-3">
        <div class="col-md-6">
            <label for="creatAt" class="form-label fw-bold">Data do Serviço:</label>
            <input 
                id="creatAt" 
                type="date" 
                formControlName="creatAt" 
                class="form-control"
            />
        </div>
    
        <div class="col-md-6">
            <label for="status" class="form-label fw-bold">Status:</label>
            <select id="status" formControlName="status" class="form-select">
                <option value="" disabled>-- Selecione um Status --</option>
                <option value="1">Aberto</option>
                <option value="2">Em Progresso</option>
                <option value="3">Finalizado</option> 
            </select>
        </div>
    </div>
    
    <hr class="mt-4 mb-4">

    <div class="d-grid">
        <button 
            type="submit" 
            [disabled]="NewOrderForm.invalid" 
            class="btn btn-primary btn-lg"
        >
            <i class="bi bi-save me-2"></i> Salvar Alterações
        </button>
    </div>
    
    <div *ngIf="MesageResponse" class="mt-3">
        <div class="alert alert-info text-center" role="alert">
            {{ MesageResponse }}
        </div>
    </div>
</form>
