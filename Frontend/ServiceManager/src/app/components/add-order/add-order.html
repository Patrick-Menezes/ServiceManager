<form [formGroup]=" NewOrderForm" (ngSubmit)=" addOrder() ">
  <div class="mb-3">
    <label for="ClientName" class="form-label">Client Name:</label>
    <input id="ClientName" formControlName="ClientName"  class="form-control"/>
  </div>
  <div>
    <label for="Description" class="form-label">Service Description:</label>
    <input id="Description" formControlName="Description"  class="form-control"/>
  </div>
  <div>
    <label for="CreatAt">Service Date:</label>
    <input id="CreatAt" type="date" formControlName="CreatAt" />
  </div>
  <div>
    <label for="orderStatus">Status:</label>
    <select id="orderStatus" formControlName="orderStatus">
      <option value="1">Pending</option>
      <option value="2">In Progress</option>
      <option value="3">Completed</option>
    </select>
  </div>
  <button type="submit" [disabled]=" NewOrderForm.invalid ">Adicionar Ordem de serviço</button>
